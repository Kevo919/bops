id: speaches
name: Speaches
repo: speaches-ai/speaches
url: https://github.com/speaches-ai/speaches
license: MIT
license_note: ""
what: A self-hosted speech server that speaks OpenAI's audio API — faster-whisper for speech to text, Kokoro and Piper for text to speech.
good_for: local voice (the mic and spoken replies without OpenAI)
stack: [python, docker]
requirements:
  docker: true
  other:
    - CPU image here; a CUDA image (ghcr.io/speaches-ai/speaches:latest-cuda) is faster with a GPU
    - models download on first use into the hf-hub-cache volume (a few GB)
keys_optional: []
keys_required: []
clone: git clone --depth 1 https://github.com/speaches-ai/speaches.git speaches
install:
  - docker pull ghcr.io/speaches-ai/speaches:latest-cpu
run: docker run -d --name speaches -p 8000:8000 -v hf-hub-cache:/home/ubuntu/.cache/huggingface/hub ghcr.io/speaches-ai/speaches:latest-cpu
background: false
kind: web
port: 8000
health:
  http: http://127.0.0.1:8000/health
  expect: 200
fits_bot_computer: false
fits_reason: Needs a Docker daemon; the CPU image is a few GB and models add a few more on first use — a PC or the VPS rather than a small bot computer.
verified: false
verified_reason: >-
  MIT (LICENSE read), the endpoints the Voice (local) module uses (/v1/audio/transcriptions,
  /v1/audio/speech) and the /health path were confirmed from a fresh clone (993994f); the run line is
  speaches.ai's documented CPU docker run with -d instead of --rm so it stays up. Not run yet: Docker
  Desktop was reserved for the lead's rebuild — live verification to follow in the next Docker window.
