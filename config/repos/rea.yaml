id: rea
name: REA (rea-agents)
repo: morluto/rea
url: https://github.com/morluto/rea
license: MIT
license_note: ""
what: A reverse-engineering CLI and MCP server for agents that statically analyzes apps, including JavaScript/Electron applications and web bundles.
good_for: analyzing JS/web apps
stack: [node]
requirements:
  node: ">=22.23.4"
  other:
    - "Node 22.x (>=22.23.4), 24.x (>=24.22.1) or >=26.12.1 per package.json engines"
    - "Other analysis modes need extra tools (Ghidra, Frida, adb, Playwright); JS analysis needs none"
keys_optional: []
keys_required: []
clone: git clone --depth 1 https://github.com/morluto/rea.git rea
install:
  - npm install --prefix ./.rea-cli rea-agents@latest
run:
  - mkdir -p /tmp/rea-demo
  - printf '{"name":"tiny","version":"1.0.0","main":"index.js"}' > /tmp/rea-demo/package.json
  - printf 'module.exports = function add(a, b) { return a + b }\n' > /tmp/rea-demo/index.js
  - ./.rea-cli/node_modules/.bin/rea analyze-javascript-application /tmp/rea-demo --json
kind: cli
health:
  cmd: ./.rea-cli/node_modules/.bin/rea --help
  expect_exit: 0
fits_bot_computer: true
fits_reason: The published npm CLI installs in about 16 s (276 MB) and its JavaScript analysis mode needs no extra tools.
verified:
  date: "2026-11-03"
  by: claude-agent (Linux sandbox, Node 22.23.4)
  commit: 8c857ce
  steps:
    clone: pass
    install: "pass: npm installed rea-agents 6.8.0 (176 packages)"
    run: "pass: analyze-javascript-application on a 2-file app returned rea.javascript-application-analysis Evidence JSON, exit 0"
    health: "pass: rea --help exit 0"
  notes: >-
    The CLI comes from the rea-agents npm package (the README's install route: npm install --global
    rea-agents); it is installed into a local prefix here so nothing global changes. The clone is kept for
    docs and examples; building from source (npm run build) was not tried. npx rea-agents setup wires the
    skill into agent clients and was not run.
