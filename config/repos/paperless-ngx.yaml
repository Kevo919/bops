id: paperless-ngx
name: Paperless-ngx
repo: paperless-ngx/paperless-ngx
url: https://github.com/paperless-ngx/paperless-ngx
license: "custom: GPL-3.0 (LICENSE file; -only or -or-later not stated)"
license_note: Copyleft (GPL-3.0); fine to self-host, but redistributed modifications must stay GPL.
what: A document management system that scans, OCRs, indexes and archives paper documents.
good_for: OCR document archive
stack: [python, django, docker]
requirements:
  docker: true
  other:
    - docker compose
    - python3 (only to generate PAPERLESS_SECRET_KEY)
keys_optional: []
keys_required:
  - name: PAPERLESS_SECRET_KEY
    for: Django secret key; the image refuses to start on the default 'change-me'. Generate once with python3 -c "import secrets; print(secrets.token_urlsafe(64))" into docker/compose/docker-compose.env
clone: git clone --depth 1 https://github.com/paperless-ngx/paperless-ngx.git paperless-ngx
install:
  - cd docker/compose && printf 'PAPERLESS_SECRET_KEY=%s\n' "$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')" >> docker-compose.env
  - cd docker/compose && docker compose -f docker-compose.sqlite.yml pull
run: cd docker/compose && docker compose -f docker-compose.sqlite.yml up -d
background: false
kind: web
port: 8000
health:
  http: http://127.0.0.1:8000/accounts/login/
  expect: 200
fits_bot_computer: false
fits_reason: Docker compose is the supported install (bare metal is documented but long); needs a Docker daemon.
verified:
  date: "2026-11-05"
  by: zai (Kevin's Windows PC, Docker Desktop 29.9.2 / WSL2)
  commit: cb3513c
  steps:
    clone: pass
    install: "pass: secret-key line appended to docker-compose.env (last assignment wins), then compose pull"
    run: "pass: compose up -d; webserver and broker Up, webserver passed its healthcheck"
    health: "pass: GET /accounts/login/ returned 200 after ~40s"
  notes: >-
    Verification found a real gap: when PAPERLESS_SECRET_KEY is still the default 'change-me' that
    docker-compose.env ships, the webserver crashed at once (django ImproperlyConfigured) and s6 stopped
    the container, so the recipe now appends a generated key in install (the upstream error message
    itself suggests this). Without that line the first up -d fails. A first admin user still needs
    `docker compose -f docker-compose.sqlite.yml run --rm webserver createsuperuser` before login works
    with a real account; the login page itself answers 200 without one.
