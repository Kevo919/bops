id: n8n
name: n8n
repo: n8n-io/n8n
url: https://github.com/n8n-io/n8n
license: "custom: Sustainable Use License (fair-code) plus n8n Enterprise License for .ee files"
license_note: >-
  Fair-code, not open source: the Sustainable Use License allows internal business and personal use but
  not offering n8n to others as a commercial service; files with ".ee" in the name need an n8n
  Enterprise license.
what: A workflow automation platform with a visual editor, hundreds of integrations and AI nodes.
good_for: workflow automation
stack: [node, typescript, docker]
requirements:
  docker: true
  other:
    - "Non-Docker alternative from the README: npx n8n (the npm package needs Node >=24)"
keys_optional:
  - name: N8N_ENCRYPTION_KEY
    for: Fixed key for encrypting stored credentials (otherwise generated into the data volume)
keys_required: []
clone: git clone --depth 1 https://github.com/n8n-io/n8n.git n8n
install:
  - docker volume create n8n_data
run: docker run -d --name n8n -p 5678:5678 -v n8n_data:/home/node/.n8n docker.n8n.io/n8nio/n8n
background: false
kind: web
port: 5678
health:
  http: http://127.0.0.1:5678/healthz
  expect: 200
fits_bot_computer: false
fits_reason: Its documented route needs a Docker daemon; npx n8n may work on Node 24 but was not tested.
verified: false
verified_reason: >-
  Needs Docker here: the sandbox has the Docker CLI but no running daemon. Clone (5339f0c9) and LICENSE.md
  were read; steps come from the README Quick Start (docker volume create + docker run, editor on :5678).
  The run line uses -d instead of the README's -it --rm so it can stay up in the background.
