name: Fork CI

on:
  pull_request:
    branches: [windows-port]
    types: [opened, synchronize, reopened, ready_for_review]

# PR code receives no write permissions or repository secrets.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  web:
    # Same fork-only guard as sync-upstream.yml.
    if: github.repository != 'OrgoAI/bops'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate route types
        # next-env.d.ts is not committed; match the existing CI prerequisite.
        run: npx next typegen
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Lint
        run: npm run lint
      - name: Look palette (no light-only colors in the window's classes)
        # A raw hex, bg-ink or text-white in components/app can't turn dark: scripts/look-codemod.mjs converts them.
        run: node scripts/look-palette.mjs --check
      - name: Bot AI tests
        run: node scripts/test-bot-ai.mjs
      - name: Subscription UI tests
        run: |
          node scripts/test-subscriptions-ui.mjs
          node scripts/test-subscriptions-ui.mjs --brains-off
      - name: Local subscription authentication tests
        run: node --conditions=react-server scripts/test-local-subscriptions.mjs
      - name: Bot tasks on this PC (Claude plan or OpenAI key) tests
        run: node --conditions=react-server scripts/test-pc-task-runner.mjs
      - name: Local Codex conversation process tests
        run: node --conditions=react-server scripts/test-local-codex-chat.mjs
      - name: Desktop and phone proxy boundary tests
        run: node --conditions=react-server scripts/test-proxy.mjs
      - name: Documents a bot makes (docx/pptx/xlsx) tests
        run: node --conditions=react-server scripts/test-docs.mjs
      - name: Brain accounts and sign-in tests
        run: node scripts/test-brains.mjs
      - name: CLI agent tests
        run: node --conditions=react-server scripts/test-cli-agents.mjs
      - name: Windows fuse and authenticated shutdown tests
        run: node scripts/test-windows-fuses.mjs
      - name: Local executor lifecycle tests
        run: node scripts/test-executor-lifecycle.mjs
      - name: Agents API Windows path serialization tests
        run: node scripts/test-agent-api-path.mjs
      - name: Phone pairing (Your phone) tests
        run: node scripts/test-easy-pairing.mjs
      - name: Agent Skill folder import tests
        run: node scripts/test-import-agent-skills.mjs
      - name: Host computer identity tests
        run: |
          node scripts/test-computer-identity.mjs win32
          node scripts/test-computer-identity.mjs darwin
          node scripts/test-computer-identity.mjs linux
      - name: Config tests
        run: node scripts/test-config.mjs
      - name: Connections tests (Zapier MCP, Composio and OpenRouter checks)
        run: node --conditions=react-server scripts/test-connections.mjs
      - name: Connections card UI tests
        run: node scripts/test-connections-ui.mjs
      - name: Composio (your account) tests (For You MCP)
        run: node --conditions=react-server scripts/test-composio-for-you.mjs
      - name: Services screen tests (service keys pasted in Settings)
        run: node --conditions=react-server scripts/test-service-keys.mjs
      - name: AgentPhone calls and texts tests (place_call, send_text, a stub AgentPhone)
        run: node --conditions=react-server scripts/test-agentphone-calls.mjs
      - name: Chat provider tests
        run: node --conditions=react-server scripts/test-chat-providers.mjs
      - name: Chat error card wording tests (a provider's no in plain words, never a key)
        run: node --experimental-strip-types --no-warnings scripts/test-chat-error.mjs
      - name: Agent chip readiness tests (where the next message's tasks really run)
        run: node --experimental-strip-types --no-warnings scripts/test-chat-readiness.mjs
      - name: Key check tests
        run: node --conditions=react-server scripts/test-key-check.mjs
      - name: LLM catalog tests
        run: node --conditions=react-server scripts/test-llms.mjs
      - name: LLM config (plain ESM) tests
        run: node --conditions=react-server scripts/test-llms-config.mjs
      - name: Models card tests
        run: node --conditions=react-server scripts/test-models-card.mjs
      - name: Models card UI tests
        run: node scripts/test-models-card-ui.mjs
      - name: OpenRouter presets, custom ids and Auto Router tests
        run: node --conditions=react-server scripts/test-openrouter-presets.mjs
      - name: Routine model tests
        run: node --conditions=react-server scripts/test-routine-model.mjs
      - name: Provider accounts tests
        run: node --conditions=react-server scripts/test-provider-accounts.mjs
      - name: Look permission and sanitizer tests
        run: node --conditions=react-server scripts/test-look.mjs
      - name: Repo recipe tests
        run: node scripts/test-repo-recipes.mjs
      - name: Bot SOUL.md and MEMORY.md tests
        run: node --conditions=react-server scripts/test-bot-docs.mjs
      - name: Bot SOUL.md and MEMORY.md UI tests
        run: node scripts/test-bot-docs-ui.mjs
      - name: Bot full settings page UI tests
        run: node scripts/test-bot-settings-ui.mjs
      - name: Cron schedule tests
        run: node scripts/test-cron.mjs
      - name: Schedule tests
        run: node --conditions=react-server scripts/test-schedules.mjs
      - name: Voice typing card UI tests
        run: node scripts/test-handy-card-ui.mjs
      - name: Memory with blank IDs or off tests
        run: node --conditions=react-server scripts/test-memory-blank-config.mjs
      - name: Memory categories (Knowledge, Orbit) tests
        run: node --conditions=react-server scripts/test-memory-categories.mjs
      - name: Orgo plan and computers tests
        run: node --conditions=react-server scripts/test-plan.mjs
      - name: Reading web pages (safe fetch, web_fetch, monitors) tests
        run: node --conditions=react-server scripts/test-web.mjs
      - name: Apps on the web (Ingot, deploys, Locals) tests
        run: node --conditions=react-server scripts/test-hosted-apps.mjs
      - name: Runner mode (what a computer's runner runs) tests
        run: node --conditions=react-server scripts/test-runner-mode.mjs
      - name: Bops Cloud (session, providers, state, tunnel, a fake cloud) tests
        run: node --conditions=react-server scripts/test-cloud.mjs
      - name: Workspaces shared with the user (read only, Write, every card by role) tests
        run: node scripts/test-shared.mjs

  # The web UI in a phone-sized window (scripts/test-mobile-layout.mjs): a production build served on loopback, a made-up
  # Orgo, Playwright's Chromium. Its own job, so the build doesn't hold up the web job's tests.
  mobile-layout:
    if: github.repository != 'OrgoAI/bops'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npx next build
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: Narrow window (phone) layout tests
        run: node scripts/test-mobile-layout.mjs
      - name: Windows wording on the screens (no Mac words on a PC, scripts/test-windows-wording.mjs)
        run: node scripts/test-windows-wording.mjs
      - name: AgentPhone panel in Settings, Services (light and dark)
        run: node scripts/test-agentphone-services-ui.mjs
      - name: Chat error card (light and dark, desktop and phone)
        run: node scripts/test-chat-error-ui.mjs

  android:
    if: github.repository != 'OrgoAI/bops'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build and lint Android
        run: |
          cd android
          ./gradlew assembleDebug lintDebug
      - name: Keep the debug APK for this pull request
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bops-remote-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
